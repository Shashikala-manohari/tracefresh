services:
  postgres:
    image: postgres:17
    container_name: tracefresh-postgres
    environment:
      POSTGRES_USER: tracefresh
      POSTGRES_PASSWORD: tracefresh
      POSTGRES_DB: recall_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracefresh -d recall_db"]
      interval: 5s
      retries: 10

volumes:
  pgdata: